<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">FireCraft</title>
  <desc id="desc">A flame drawn as vector artwork under edit: an ember-gold gradient shape with the selection nodes and a Bézier handle of a live path showing on its outline.</desc>
  <defs>
    <linearGradient id="ember" x1="52" y1="16" x2="204" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD36A"/>
      <stop offset=".45" stop-color="#FF9A24"/>
      <stop offset="1" stop-color="#E8451F"/>
    </linearGradient>
    <linearGradient id="light" x1="96" y1="128" x2="166" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF4D8"/>
      <stop offset="1" stop-color="#FFC45B"/>
    </linearGradient>
    <path id="flame" d="M128 236
      C80 230 44 188 44 146
      C44 114 62 92 84 70
      C104 50 122 38 126 16
      C148 40 164 68 166 96
      C186 84 200 66 206 48
      C214 84 216 116 212 144
      C205 196 174 232 128 236Z"/>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="#171B24"/>
  <use href="#flame" fill="url(#ember)"/>
  <use href="#flame" fill="url(#light)" transform="translate(128 236) scale(.46) translate(-128 -236)"/>
  <g fill="none" stroke="#EAF0FF" stroke-width="3.2" opacity=".95">
    <rect x="120" y="10" width="12" height="12"/>
    <rect x="38" y="140" width="12" height="12"/>
    <rect x="206" y="138" width="12" height="12"/>
    <rect x="122" y="230" width="12" height="12"/>
  </g>
  <g stroke="#EAF0FF" stroke-width="2" opacity=".65" fill="#EAF0FF">
    <path d="M44 188V104" fill="none"/>
    <circle cx="44" cy="188" r="3.2" stroke="none"/>
    <circle cx="44" cy="104" r="3.2" stroke="none"/>
  </g>
</svg>
