# GitHub Actions backup CI — mirrors the GitForge 7-job pipeline.
# GitForge is primary; this is the fallback if GitForge is unavailable.
#
# Two-job design:
#   fmt  — fast (~30s), fails fast, no expensive tool installs needed
#   gate — the full `xtask ci-no-fmt` suite; only runs if fmt passes
#
# Both run on all pushes and PRs. The fmt job prevents wasted runner
# time on formatting errors that would fail clippy anyway.

name: CI (backup)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Also check the workspace-excluded web crate explicitly.
      - name: Check web formatting
        run: cargo fmt --manifest-path web/Cargo.toml -- --check

  gate:
    name: gate
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install aegis
        run: |
          # aegis 0.6.3 — must match the version pinned in the GitForge CI
          # image, or the baseline findings shift and the gate fails on
          # tool drift rather than on a real finding.
          set -euo pipefail
          url=https://github.com/aliasfoxkde/aegis/releases/download/v0.6.3/aegis-linux-x86_64.tar.gz
          curl -sSL -o aegis.tar.gz "$url"
          echo "835fad56172f8977a91424a580d0a3ec0c5b59fea99f4c2eb4c0a88fce30ff9e  aegis.tar.gz" \
            | sha256sum -c -
          tar xzf aegis.tar.gz aegis
          sudo mv aegis /usr/local/bin/aegis
          aegis --version

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install cargo-llvm-cov
        # The coverage gate runs `cargo llvm-cov`; a fresh runner has no
        # cargo-llvm-cov, and the step would fail with "no such command".
        # --locked pins the version so the gate's output is reproducible.
        run: cargo install cargo-llvm-cov --locked

      - name: Install trunk
        # `xtask wasm` skips the web bundle when trunk is absent — but the
        # browser bundle is the primary release target, so CI must build
        # it or a broken web/ change reaches the deploy unnoticed.
        run: cargo install trunk --locked

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-build-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-build-${{ runner.os }}-

      # `ci-no-fmt` skips the fmt step so the two jobs stay independent —
      # fmt is owned by the `fmt` job above.
      - name: Full gate (xtask ci-no-fmt)
        run: cargo run --package xtask -- ci-no-fmt
        continue-on-error: false

      # Smoke for the web bundle — only runs on tag pushes (release candidates)
      - name: Web bundle smoke
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo run --package xtask -- dist --web
        continue-on-error: false
