# GitHub Actions backup CI. GitForge is primary; this is the fallback.
# Docs-only changes get a fast whitespace/conflict-marker check and do not
# install Rust/Aegis/coverage tooling or run the full xtask gate. The workflow
# remains active for every PR/push so required checks are not path-filtered
# into a permanently pending state.
name: CI (backup)
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  changes:
    name: classify-change
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      code_changed: ${{ steps.classify.outputs.code_changed }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Classify changed paths (fail closed on unknown/empty diff)
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$REF" == refs/tags/* ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$BEFORE_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then base="$PR_BASE_SHA"; fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            files=$(git diff --name-only "$base...$GITHUB_SHA")
          else
            files=$(git diff --name-only "$base" "$GITHUB_SHA")
          fi
          if [[ -z "$files" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docs_only=true
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              docs/*|README.md|CHANGELOG.md|CONTRIBUTING.md|LICENSE|CODE_OF_CONDUCT.md) ;;
              *) docs_only=false; break ;;
            esac
          done <<< "$files"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          if [[ "$docs_only" == "true" ]]; then
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
          fi
          printf 'Changed files:\n%s\n' "$files"
      # Every action reference is pinned to a commit SHA. This runs in the
      # `changes` job — which every push and pull request executes, and
      # which the `fmt` and `gate` jobs depend on — so an unpinned action
      # fails the workflow before any job builds or publishes anything.
      - name: Every action is pinned to a commit SHA
        run: |
          python3 scripts/validate_workflow_pins.py .github/workflows
          bash scripts/validate_workflow_pins-selftest.sh
      # The release path — the script that stages the artifacts and builds
      # the `gh release create` call, and the rule that decides whether a
      # tag is a production release or a rehearsal — is exercised here
      # against a stub `gh`, because in the workflow it runs once, on a
      # tag, with no test around it.
      - name: The release path is exercised
        run: |
          bash tests/release-assets-selftest.sh
          bash scripts/classify_release_mode-selftest.sh
          bash scripts/validate_release_aggregate-selftest.sh
  docs:
    name: docs-only-check
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.docs_only == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate whitespace and merge markers
        run: |
          set -euo pipefail
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' docs README.md CONTRIBUTING.md 2>/dev/null; then
            echo "Unresolved merge-conflict marker found in documentation."
            exit 1
          fi
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code_changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # The toolchain is pinned, not floating.  The coverage floor is a
          # number about this compiler's instrumentation: rustc 1.100.0
          # measures the same source 4.9 points lower than 1.99.1 does
          # (decision 0102).  A floating `stable` moved that floor
          # silently, and the GitForge image (rust:1.99) kept the old
          # number, so the two pipelines disagreed.
          toolchain: 1.99.1
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check web formatting
        run: cargo fmt --manifest-path web/Cargo.toml -- --check

      # The GitForge pipeline definition is parsed server-side by
      # `PipelineDefinition::parse`, which has no dry-run endpoint: a
      # malformed `.gitforge.yml` fails every run at parse time, after
      # the commit has already landed. This is the offline check of the
      # same contract, and it also enforces the per-job Cargo cache
      # directories that keep the runner's exclusive mount lock from
      # serializing the whole fleet.
      - name: Validate the GitForge pipeline definition
        run: |
          set -euo pipefail
          python3 -m venv /tmp/pipeline-venv
          /tmp/pipeline-venv/bin/pip install --quiet pyyaml
          /tmp/pipeline-venv/bin/python scripts/validate_gitforge_pipeline.py .gitforge.yml
  gate:
    name: gate
    runs-on: ubuntu-latest
    needs: [changes, fmt]
    if: needs.changes.outputs.code_changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # Pinned to the compiler the coverage floor was measured with
          # (decision 0102).  `stable` is not a measurement basis: 1.100.0
          # reads the same source 4.9 points lower than 1.99.1 does, and
          # the GitForge image stays on 1.99.
          toolchain: 1.99.1
          components: clippy, rustfmt
      - name: Install Aegis
        run: |
          set -euo pipefail
          url=https://github.com/aliasfoxkde/aegis/releases/download/v0.6.3/aegis-linux-x86_64.tar.gz
          curl -sSL -o aegis.tar.gz "$url"
          echo "835fad56172f8977a91424a580d0a3ec0c5b59fea99f4c2eb4c0a88fce30ff9e  aegis.tar.gz" | sha256sum -c -
          tar xzf aegis.tar.gz aegis
          sudo mv aegis /usr/local/bin/aegis
          aegis --version
      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache cargo index
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/git
          key: cargo-index-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target
          key: cargo-build-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-build-${{ runner.os }}-
      - name: Cache cargo-llvm-cov
        id: cache-llvc
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-llvm-cov (if uncached)
        if: steps.cache-llvc.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --locked
      - name: Cache trunk
        id: cache-trunk
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/trunk
          key: trunk-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install trunk (if uncached)
        if: steps.cache-trunk.outputs.cache-hit != 'true'
        run: cargo install trunk --locked
      - name: Full gate (xtask ci-no-fmt)
        run: cargo run --package xtask -- ci-no-fmt
      - name: Web bundle smoke
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo run --package xtask -- dist --web
