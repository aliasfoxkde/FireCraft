# GitHub Actions backup CI — mirrors the GitForge 7-job pipeline.
# GitForge is primary; this is the fallback if GitForge is unavailable.
# Trigger: push to main and all branches (quick feedback), tags (releases).
# The full gate (aegis + coverage + fmt + clippy + test + layers + wasm +
# corpus + perf + fuzz + parity + scorecard + changelog) runs in one job.
# No secrets required; no code is published from this workflow.

name: CI (backup)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Disable network fetches in the Rust image to match GitForge offline behavior
  CARGO_NET_OFFLINE: false

jobs:
  ci:
    name: full gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install aegis
        run: |
          # aegis 0.6.3 — must match the version pinned in the GitForge CI
          # image, or the baseline findings shift and the gate fails on
          # tool drift rather than on a real finding.
          set -euo pipefail
          url=https://github.com/aliasfoxkde/aegis/releases/download/v0.6.3/aegis-linux-x86_64.tar.gz
          curl -sSL -o aegis.tar.gz "$url"
          echo "835fad56172f8977a91424a580d0a3ec0c5b59fea99f4c2eb4c0a88fce30ff9e  aegis.tar.gz" \
            | sha256sum -c -
          tar xzf aegis.tar.gz aegis
          sudo mv aegis /usr/local/bin/aegis
          aegis --version

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install cargo-llvm-cov
        # The coverage gate runs `cargo llvm-cov`; a fresh runner has no
        # cargo-llvm-cov, and the step would fail with "no such command".
        # --locked pins the version so the gate's output is reproducible.
        run: cargo install cargo-llvm-cov --locked

      - name: Install trunk
        # `xtask wasm` skips the web bundle when trunk is absent — but the
        # browser bundle is the primary release target, so CI must build
        # it or a broken web/ change reaches the deploy unnoticed.
        run: cargo install trunk --locked

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-build-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-build-${{ runner.os }}-

      # The full gate. `xtask ci` is the single source of truth for the
      # gate list (aegis → coverage → fmt → clippy → test → layers →
      # wasm → corpus → floor → scripts → golden → svg-golden →
      # svg-roundtrip → web-golden → perf → fuzz → parity → scorecard →
      # changelog). A hand-written step list here silently drifted from
      # it and missed six gates; calling the canonical command means the
      # workflow cannot drift again. Each gate prints its own name, so a
      # failure is still identifiable in the log.
      - name: Full gate (xtask ci)
        run: cargo run --package xtask -- ci
        continue-on-error: false

      # Smoke for the web bundle — only runs on tag pushes (release candidates)
      - name: Web bundle smoke
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo run --package xtask -- dist --web
        continue-on-error: false
