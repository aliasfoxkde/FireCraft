name: Deploy FireCraft marketing review preview

on:
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "tests/site-release-loader.test.mjs"
      - ".github/workflows/deploy-site.yml"
  push:
    branches: [main]
    # The trigger is the deployed content, not this file. The workflow's own
    # source is not part of the Pages deployment — the deploy step publishes
    # `site/` — so listing it here made every edit to this file a production
    # publication. Production deploys stay tied to a change in what is
    # published; a deliberate redeploy is `workflow_dispatch`.
    paths:
      - "site/**"
      - "wrangler.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firecraft-site-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate marketing site
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate static site
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -s site/app.js
          test -s site/extensions.html
          test -s site/extensions.css
          test -s site/assets/firecraft-mark.png
          grep -q 'name="description"' site/index.html
          grep -q 'prefers-reduced-motion' site/styles.css
          grep -q 'loadRelease' site/app.js
          node --test tests/site-release-loader.test.mjs

  deploy:
    name: Deploy Cloudflare Pages preview
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The production branch of firecraft-web serves the WASM application.
          # Keep marketing on a stable, non-production preview branch.
          command: pages deploy site --project-name=firecraft-web --branch=marketing-review
