name: Deploy FireCraft marketing site

on:
  push:
    branches: [main]
    # The trigger is the deployed content, not this file. The workflow's own
    # source is not part of the Pages deployment — the deploy step publishes
    # `site/` — so listing it here made every edit to this file a production
    # publication. Production deploys stay tied to a change in what is
    # published; a deliberate redeploy is `workflow_dispatch`.
    paths:
      - "site/**"
      - "wrangler.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firecraft-site-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate and deploy Cloudflare Pages
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate static site
        run: |
          # Every page must exist and be non-empty; Pages serves these paths directly.
          for page in index features gallery formats downloads docs project 404; do
            test -s "site/${page}.html"
          done
          test -s site/styles.css
          test -s site/app.js
          test -s site/_headers
          test -s site/robots.txt
          test -s site/assets/firecraft-mark.svg
          test -s site/assets/app-main.png
          test -s site/assets/mask-stack.png

          # Content and accessibility anchors the pages depend on.
          grep -q 'name="description"' site/index.html
          grep -q 'prefers-reduced-motion' site/styles.css
          grep -q 'data-release' site/app.js
          grep -q 'skip-link' site/index.html

          # The site promises no third-party font, script, or analytics host.
          if grep -rIlE 'fonts\.googleapis|fonts\.gstatic|googletagmanager|google-analytics' site; then
            echo "site/ must not reference a third-party font or analytics host."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=firecraft-site --branch=main
