# GitHub Actions release workflow — triggered on tag push (e.g. v0.2.2).
#
# What it does:
#   1. Builds native artifacts (desktop tar.gz, CLI tar.gz, DEB)
#   2. Builds the optimized web bundle and ZIP
#   3. Builds a clean-extract-verified source archive
#   4. Generates a CycloneDX 1.5 SBOM
#   5. Generates release-wide SHA-256 checksums and validates all 8 assets
#   6. Creates a draft GitHub Release with the validated assets
#
# What it does NOT do (operator handles):
#   - Bumping versions (8 stamps in Cargo.toml files)
#   - Running `xtask changelog`
#   - Tagging and pushing
#   - Cloudflare Pages deployment
#   - Publishing the draft release
#
# Setup: ensure `CLOUDFLARE_API_TOKEN` is set in repo secrets for
# `wrangler pages deploy` if the deploy step is uncommented below.

name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

# Least privilege by default: no job gets a writable token unless it
# asks for one. Only the `release` job escalates, to `contents: write`.
permissions:
  contents: read

jobs:
  build:
    name: build artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: cargo-release-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install trunk
        # `dist --web` shells out to `trunk build --release`; without it
        # the web bundle step dies with "trunk not on PATH".
        run: cargo install trunk --locked

      - name: Verify headless Chrome
        # ubuntu-24.04 runner images provide Google Chrome. Ubuntu's
        # chromium-browser package is only a Snap-transition package.
        run: |
          if command -v google-chrome-stable >/dev/null 2>&1; then
            google-chrome-stable --version
          elif command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          else
            echo "::error::headless Chrome is required for the dist --web bridge smoke"
            exit 1
          fi

      - name: Build native artifacts
        run: cargo run --quiet --package xtask -- dist --native

      - name: Build web bundle
        run: cargo run --quiet --package xtask -- dist --web

      - name: Build source archive
        # git archive of the checkout's HEAD (the tag SHA), verified by
        # clean extraction + `cargo metadata --locked` inside xtask.
        run: cargo run --quiet --package xtask -- dist --source

      - name: Build SBOM
        # CycloneDX 1.5 over the full locked dependency graph.
        run: cargo run --quiet --package xtask -- dist --sbom

      - name: Zip web bundle
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The zip name must match the checksum step's path exactly —
          # "${TAG}" keeps the "v" (v0.2.2) while the artifacts are
          # named without it (0.2.2), matching the native set.
          cd dist/web
          zip -qr "../firecraft-web-${TAG#v}.zip" .
          cd ../..

      - name: Generate checksums
        run: |
          # Name each file explicitly. The globs over-match:
          # `firecraft-*.tar.gz` also matches `firecraft-cli-*.tar.gz`,
          # and `firecraft-web-*.zip` picks up older versions left in dist/.
          # Bare filenames (sed strips the dist/ prefix) so the aggregate
          # job's `sha256sum -c` works against the flat artifacts/ dir.
          (
            sha256sum "dist/native/firecraft-${TAG#v}-linux-x86_64.tar.gz"
            sha256sum "dist/native/firecraft-cli-${TAG#v}-linux-x86_64.tar.gz"
            sha256sum "dist/native/firecraft_${TAG#v}_amd64.deb"
            sha256sum "dist/firecraft-web-${TAG#v}.zip"
            sha256sum "dist/source/FireCraft-${TAG#v}-source.tar.gz"
            sha256sum "dist/sbom/firecraft-${TAG#v}-sbom.cdx.json"
            sha256sum dist/native/MANIFEST.sha256
          ) | sed 's# dist/native/# #; s# dist/source/# #; s# dist/sbom/# #; s# dist/# #' > dist/RELEASE_SHA256.txt
        env:
          TAG: ${{ github.ref_name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/native/firecraft-*.tar.gz
            dist/native/firecraft-cli-*.tar.gz
            dist/native/firecraft_*.deb
            dist/native/MANIFEST.sha256
            dist/firecraft-web-*.zip
            dist/source/FireCraft-*-source.tar.gz
            dist/sbom/firecraft-*-sbom.cdx.json
            dist/RELEASE_SHA256.txt
          retention-days: 5
          # A clean runner has no stale artifacts, but a self-hosted or
          # re-run job might. Fail loudly on a name collision rather
          # than shipping two versions' files as one release.
          if-no-files-found: error
          overwrite: true

  release:
    name: create draft release
    runs-on: ubuntu-24.04
    needs: [build]
    permissions:
      contents: write
    steps:
      # Checkout runs BEFORE the artifact download. actions/checkout@v4
      # deletes every child of the workspace when the workspace does not
      # yet hold a .git, so a checkout placed after the download erases
      # the artifacts it just downloaded.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifact-tree/

      - name: Stage release assets
        # upload-artifact stores the least common ancestor of the
        # uploaded paths as the archive root, so the artifact is a tree
        # (native/, source/, sbom/) rather than a flat file list. The
        # aggregate validation and `sha256sum -c` below both need one
        # flat directory, and the asset list handed to `gh` must be that
        # same flat set — so flatten once, here, and let the script emit
        # the list the release step attaches.
        run: |
          set -euo pipefail
          bash packaging/release-assets.sh stage artifact-tree artifacts release-assets.zlist

      - name: Fail-closed aggregate validation
        # RP-07: the aggregate must reject a release that is missing any
        # required artifact, misnamed, empty, or whose digests disagree
        # with RELEASE_SHA256.txt — before gh release create runs.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Without nullglob an unmatched glob expands to the literal
          # pattern, which would be validated as a file name.
          shopt -s nullglob
          expected=(
            "firecraft-${TAG#v}-linux-x86_64.tar.gz"
            "firecraft-cli-${TAG#v}-linux-x86_64.tar.gz"
            "firecraft_${TAG#v}_amd64.deb"
            "firecraft-web-${TAG#v}.zip"
            "FireCraft-${TAG#v}-source.tar.gz"
            "firecraft-${TAG#v}-sbom.cdx.json"
            "MANIFEST.sha256"
            "RELEASE_SHA256.txt"
          )
          fail=0
          for name in "${expected[@]}"; do
            path="artifacts/$name"
            if [ ! -f "$path" ]; then
              echo "::error::required artifact missing: $name"
              fail=1
            elif [ ! -s "$path" ]; then
              echo "::error::required artifact empty: $name"
              fail=1
            fi
          done
          # Every digested file must still match its recorded hash —
          # a mismatch after download means a corrupted/mislabeled asset.
          # The aggregate includes the native manifest's own digest;
          # it is not recursive, so verify it along with every other file.
          (cd artifacts && sha256sum -c RELEASE_SHA256.txt) || fail=1
          # Version consistency: no artifact of one version may carry a
          # different version string in its name than the tag.
          for f in artifacts/*; do
            case "$(basename "$f")" in
              *"${TAG#v}"*) ;;
              *.sha256|*.txt) ;;
              *) echo "::error::artifact name does not carry the tag version: $(basename "$f")"; fail=1 ;;
            esac
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::aggregate validation failed — refusing to create the release"
            exit 1
          fi
          echo "aggregate validation ok: ${#expected[@]} required artifacts present, digests verified"

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Release body: the tracked notes in docs/releases/. Falls back
          # to the checksum list only if that file is missing, so a release
          # is never published with a bare SHA dump as its description.
          notes="docs/releases/${TAG}.md"
          if [ ! -f "$notes" ]; then
            echo "::warning::${notes} not found; using checksum list as release body"
            notes="artifacts/RELEASE_SHA256.txt"
          fi
          # `gh release create` takes its assets as POSITIONAL arguments
          # after the tag; it has no -a/--asset flag, and passing one
          # aborts the command with "unknown shorthand flag: 'a' in -a".
          # packaging/release-assets.sh owns that construction so it can
          # be tested directly instead of asserted on here.
          bash packaging/release-assets.sh create "$TAG" release-assets.zlist "$notes"

      # Uncomment to also deploy to Cloudflare Pages on every tag push.
      # Requires CLOUDFLARE_API_TOKEN in repo secrets.
      # - name: Deploy to Cloudflare Pages
      #   env:
      #     CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      #   run: wrangler pages deploy dist/web --project-name firecraft-web
