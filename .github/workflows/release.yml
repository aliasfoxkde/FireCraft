# GitHub Actions release workflow — triggered on tag push (e.g. v0.2.2).
#
# What it does:
#   1. Builds native artifacts (desktop tar.gz, CLI tar.gz, DEB)
#   2. Builds the optimized web bundle and ZIP
#   3. Builds a clean-extract-verified source archive
#   4. Generates a CycloneDX 1.5 SBOM
#   5. Generates release-wide SHA-256 checksums
#   6. Generates the machine-readable release manifest (release-manifest.json)
#   7. Validates all 9 assets and creates a draft GitHub Release
#
# What it does NOT do (operator handles):
#   - Bumping versions (8 stamps in Cargo.toml files)
#   - Running `xtask changelog`
#   - Tagging and pushing
#   - Cloudflare Pages deployment
#   - Publishing the draft release
#
# Setup: ensure `CLOUDFLARE_API_TOKEN` is set in repo secrets for
# `wrangler pages deploy` if the deploy step is uncommented below.

name: Release

on:
  push:
    tags: ["v*"]
  # A manual run is a rehearsal of the release path. It can never cut a
  # production release: the mode classifier rejects a production-shaped
  # tag here (see the "Classify the release mode" step), and the
  # rehearsal release is a prerelease titled `TEST <version>`.
  workflow_dispatch:
    inputs:
      rehearsal_tag:
        description: "Disposable rehearsal tag, e.g. v0.2.6-dryrun.1 (never a production tag)"
        required: true
        type: string

# Least privilege by default (read-only checkout + artifact upload);
# the `release` job widens to `contents: write` because `gh release
# create` needs it. Declaring this keeps the default `GITHUB_TOKEN`
# from inheriting a broader grant — the rule
# `actions/missing-workflow-permissions` fires without it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Determine the release version
        # The version every artifact carries is the workspace version —
        # not the tag. The tag names what is being released; the version
        # names what was built. On a tag push the two agree (xtask's
        # manifest generator refuses to build a tag that disagrees with
        # the tree), and on a rehearsal the tag is a disposable name
        # while the artifacts still describe the version they carry.
        id: version
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "xtask") | .version')
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::could not read the workspace version from cargo metadata"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "the workspace builds version $version"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # The release artifacts are built with the compiler the gate
          # judged, not with whatever `stable` happens to be that week
          # (decision 0102).
          toolchain: 1.99.1

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo
          key: cargo-release-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install trunk
        # `dist --web` shells out to `trunk build --release`; without it
        # the web bundle step dies with "trunk not on PATH".
        run: cargo install trunk --locked

      - name: Verify headless Chrome
        # ubuntu-24.04 runner images provide Google Chrome. Ubuntu's
        # chromium-browser package is only a Snap-transition package.
        run: |
          if command -v google-chrome-stable >/dev/null 2>&1; then
            google-chrome-stable --version
          elif command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          else
            echo "::error::headless Chrome is required for the dist --web bridge smoke"
            exit 1
          fi

      - name: Build native artifacts (Debian 12 glibc)
        # The native artifacts must link against the glibc of the platform
        # they ship to. `packaging/deb/control` declares `libc6 (>= 2.36)`
        # and the package installs on Debian 12; linking on this
        # ubuntu-24.04 runner (glibc 2.39) tags Rust std's weak
        # `pidfd_spawnp`/`pidfd_getpid` references with (GLIBC_2.39) and
        # produces a package that cannot install on Debian 12. Build inside
        # the same Debian 12 base the CI image uses — see
        # docs/decisions/0077-deb-glibc-floor.md.
        #
        # `--user` keeps the artifact tree owned by the runner (a
        # root-owned `dist/` would break the later web build), and the
        # cargo registry cache is mounted so the release build does not
        # re-download the dependency graph.
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e CARGO_HOME=/cargo \
            -e HOME=/tmp \
            -v "$PWD:/w" \
            -v "$HOME/.cargo:/cargo" \
            -w /w \
            rust:1.99-slim-bookworm \
            cargo run --quiet --package xtask -- dist --native

      - name: Verify the DEB installs and runs on Debian 12
        # The floor claim is only real if the package installs on the
        # platform it declares. `firecraft-cli` links against libc only,
        # so running it proves the loader resolved every symbol the
        # declared floor covers — the exact failure a too-low floor
        # produces (installs on an older system, then fails at exec).
        run: |
          docker run --rm \
            -v "$PWD/dist/native:/dist:ro" \
            -v "$PWD/packaging/deb:/pkg:ro" \
            -v "$PWD/corpus/fixtures:/fixtures:ro" \
            debian:12-slim bash -c '
            set -eu
            apt-get update -qq >/dev/null
            apt-get install -y -qq --no-install-recommends \
              xvfb xauth libgl1 libx11-6 libxcursor1 libxrandr2 libxi6 \
              libxkbcommon0 libxkbcommon-x11-0 desktop-file-utils >/dev/null
            bash /pkg/verify-install.sh \
              /dist/firecraft_*.deb "" /fixtures/composed.fw.png
          '

      - name: Build web bundle
        run: cargo run --quiet --package xtask -- dist --web

      - name: Build source archive
        # git archive of the checkout's HEAD (the tag SHA), verified by
        # clean extraction + `cargo metadata --locked` inside xtask.
        run: cargo run --quiet --package xtask -- dist --source

      - name: Build SBOM
        # CycloneDX 1.5 over the full locked dependency graph.
        run: cargo run --quiet --package xtask -- dist --sbom

      - name: Zip web bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The zip name must match the checksum step's path exactly —
          # the artifacts are named by the version they carry, without
          # the tag's "v" prefix.
          cd dist/web
          zip -qr "../firecraft-web-${VERSION}.zip" .
          cd ../..

      - name: Generate checksums
        run: |
          # Name each file explicitly. The globs over-match:
          # `firecraft-*.tar.gz` also matches `firecraft-cli-*.tar.gz`,
          # and `firecraft-web-*.zip` picks up older versions left in dist/.
          # Bare filenames (sed strips the dist/ prefix) so the aggregate
          # job's `sha256sum -c` works against the flat artifacts/ dir.
          (
            sha256sum "dist/native/firecraft-${VERSION}-linux-x86_64.tar.gz"
            sha256sum "dist/native/firecraft-cli-${VERSION}-linux-x86_64.tar.gz"
            sha256sum "dist/native/firecraft_${VERSION}_amd64.deb"
            sha256sum "dist/firecraft-web-${VERSION}.zip"
            sha256sum "dist/source/firecraft-${VERSION}-source.tar.gz"
            sha256sum "dist/sbom/firecraft-${VERSION}-sbom.cdx.json"
            sha256sum dist/native/MANIFEST.sha256
          ) | sed 's# dist/native/# #; s# dist/source/# #; s# dist/sbom/# #; s# dist/# #' > dist/RELEASE_SHA256.txt
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Generate release manifest
        # The machine-readable release manifest (T27-54): one JSON
        # document describing every published asset — canonical name,
        # path relative to the output directory, byte size, SHA-256,
        # package format, target triple and verification status — plus
        # the version, tag, source revision, workflow run URL and build
        # timestamp of the run that produced it. It is generated after
        # every asset exists, and the verifier then re-reads it against
        # the files on disk.
        run: |
          cargo run --quiet --package xtask -- dist --manifest
          cargo run --quiet --package xtask -- dist --verify-manifest

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: |
            dist/native/firecraft-*.tar.gz
            dist/native/firecraft-cli-*.tar.gz
            dist/native/firecraft_*.deb
            dist/native/MANIFEST.sha256
            dist/firecraft-web-*.zip
            dist/source/firecraft-*-source.tar.gz
            dist/sbom/firecraft-*-sbom.cdx.json
            dist/RELEASE_SHA256.txt
            dist/release-manifest.json
          retention-days: 5
          # A clean runner has no stale artifacts, but a self-hosted or
          # re-run job might. Fail loudly on a name collision rather
          # than shipping two versions' files as one release.
          if-no-files-found: error
          overwrite: true

  release:
    name: create draft release
    runs-on: ubuntu-24.04
    needs: [build]
    # `gh release create` writes a release (and its assets) — the one
    # place this workflow needs more than read.
    permissions:
      contents: write
    steps:
      # Checkout runs BEFORE the artifact download. actions/checkout@v4
      # deletes every child of the workspace when the workspace does not
      # yet hold a .git, so a checkout placed after the download erases
      # the artifacts it just downloaded.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifacts
          path: artifact-tree/

      - name: Stage release assets
        # upload-artifact stores the least common ancestor of the
        # uploaded paths as the archive root, so the artifact is a tree
        # (native/, source/, sbom/) rather than a flat file list. The
        # aggregate validation and `sha256sum -c` below both need one
        # flat directory, and the asset list handed to `gh` must be that
        # same flat set — so flatten once, here, and let the script emit
        # the list the release step attaches.
        run: |
          set -euo pipefail
          bash packaging/release-assets.sh stage artifact-tree artifacts release-assets.zlist

      - name: Fail-closed aggregate validation
        # RP-07: the aggregate must reject a release that is missing any
        # required artifact, misnamed, empty, or whose digests disagree
        # with RELEASE_SHA256.txt — before gh release create runs. The
        # release manifest is checked against the same assets: it must
        # carry the build's version, list every published asset, describe
        # each one with the digest and size the asset actually has, and
        # represent every required platform.
        #
        # The gate lives in scripts/validate_release_aggregate.sh so it
        # can be exercised by its own self-test: in the workflow it runs
        # once, on a tag, with nothing around it to tell it apart from a
        # run that is merely quiet.
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/validate_release_aggregate.sh artifacts "$VERSION"

      - name: Classify the release mode
        # The tag decides whether this run cuts a release or rehearses
        # one. The rule lives in scripts/classify_release_mode.sh and
        # fails closed on every tag it does not recognise. A manual run
        # may only rehearse: a production release requires a tag push.
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          PUSHED_TAG: ${{ github.ref_name }}
          REHEARSAL_TAG: ${{ inputs.rehearsal_tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            tag="$REHEARSAL_TAG"
            if [ -z "$tag" ]; then
              echo "::error::a manual run must name its disposable rehearsal tag (e.g. v${VERSION}-dryrun.1)"
              exit 1
            fi
            mode=$(bash scripts/classify_release_mode.sh "$tag" "$VERSION")
            if [ "$mode" != test ]; then
              echo "::error::a manual run may only rehearse — '$tag' is a production release tag"
              exit 1
            fi
          else
            tag="$PUSHED_TAG"
            mode=$(bash scripts/classify_release_mode.sh "$tag" "$VERSION")
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "release tag $tag is a $mode run of version ${VERSION}"

      - name: Create the rehearsal tag
        # A rehearsal tag does not exist yet: `gh release create` would
        # create it at the default branch, and the release would then
        # describe a commit that did not build the artifacts. The tag is
        # created here, at the exact commit the build ran on, so the
        # artifacts and the tag bind to one SHA. It is a disposable
        # rehearsal tag: it carries the `-dryrun.<n>` marker, the
        # classifier has already accepted that shape, and an existing
        # tag is never overwritten.
        if: steps.mode.outputs.mode == 'test' && github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.mode.outputs.release_tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "::error::the tag $RELEASE_TAG already exists — refusing to overwrite it"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::the tag $RELEASE_TAG already exists on the remote — refusing to overwrite it"
            exit 1
          fi
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
          echo "created the disposable rehearsal tag $RELEASE_TAG at $GITHUB_SHA"

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.mode.outputs.release_tag }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          # Release body: the tracked notes in docs/releases/. A
          # production release must carry them — a release whose
          # description is a checksum dump is not a release. A rehearsal
          # may fall back to the checksum list, because its description
          # is never the published one.
          notes="docs/releases/${TAG}.md"
          if [ "$MODE" = production ]; then
            if [ ! -f "$notes" ]; then
              echo "::error::$notes not found — a production release must carry its tracked release notes"
              exit 1
            fi
          elif [ ! -f "$notes" ]; then
            echo "::warning::${notes} not found; using checksum list as release body"
            notes="artifacts/RELEASE_SHA256.txt"
          fi
          # `gh release create` takes its assets as POSITIONAL arguments
          # after the tag; it has no -a/--asset flag, and passing one
          # aborts the command with "unknown shorthand flag: 'a' in -a".
          # packaging/release-assets.sh owns that construction so it can
          # be tested directly instead of asserted on here.
          bash packaging/release-assets.sh create "$TAG" release-assets.zlist "$notes" "$MODE"

      # Uncomment to also deploy to Cloudflare Pages on every tag push.
      # Requires CLOUDFLARE_API_TOKEN in repo secrets.
      # - name: Deploy to Cloudflare Pages
      #   env:
      #     CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      #   run: wrangler pages deploy dist/web --project-name firecraft-web
