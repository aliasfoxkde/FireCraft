[package]
name = "io"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "FireCraft import/export codecs: raster formats, PSD, SVG."

[dependencies]
doc = { path = "../doc" }
fwpng = { path = "../fwpng" }
gif = "0.14.2"
color_quant = "1.1.0"
raster = { path = "../raster" }
geom = { path = "../geom" }
compose = { path = "../compose" }
filters = { path = "../filters" }
text = { path = "../text" }
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "gif", "webp"] }
usvg = "0.45.1"
jpeg-encoder = "0.6.1"
tiff = "0.11.3"
base64 = "0.22.1"

# Lossy WebP encoding: VP8 via libwebp-sys (static linking, native only).
# The wasm32 target cannot enable this — it gets "lossy WebP not supported
# in browser" at the ops layer instead.
libwebp-sys = { version = "0.14.4", optional = true }

[features]
default = []
lossy-webp = ["libwebp-sys"]

# lossy-webp requires libwebp-sys (pure-unsafe C FFI). The workspace sets
# `unsafe_code = "forbid"`, which an inner `allow` cannot override, so this
# crate restates the full lint table with that one key relaxed. Keep every
# other workspace deny here: an explicit table replaces the workspace's,
# so a key omitted from it is a lint that silently does not run.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
exit = "deny"
doc_markdown = "deny"
must_use_candidate = "deny"
needless_pass_by_value = "deny"
