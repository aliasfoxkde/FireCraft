[package]
name = "app-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["FireCraft contributors"]
repository = "https://github.com/aliasfoxkde/FireCraft"
homepage = "https://github.com/aliasfoxkde/FireCraft"
description = "Headless FireCraft command line: document info, canonical convert, journal replay. Clean-room implementation."

[[bin]]
name = "firecraft-cli"
path = "src/main.rs"

[dependencies]
doc = { path = "../doc" }
engine = { path = "../engine" }
fwpng = { path = "../fwpng" }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde_json = "1"

[lints]
workspace = true
