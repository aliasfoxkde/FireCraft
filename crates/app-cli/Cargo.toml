[package]
name = "app-cli"
version = "0.2.3"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["FireCraft contributors"]
repository = "https://github.com/aliasfoxkde/FireCraft"
homepage = "https://github.com/aliasfoxkde/FireCraft"
description = "Headless FireCraft command line: document info, canonical convert, journal replay. Clean-room implementation."

[[bin]]
name = "firecraft-cli"
path = "src/main.rs"

[features]
default = ["scripting"]
# Native-only automation surface (PLANNING §7.4/§7.5): `run-script` and
# the MCP `firecraft.runScript` tool link the scripting engine. The
# wasm build drops them with --no-default-features — the web shell
# embeds scripting directly; the control channel never crosses wasm.
scripting = ["dep:scripting"]
# Enable lossy WebP export via libwebp-sys (native only; browser wasm
# gets "lossy WebP not supported in browser").
lossy-webp = ["io/lossy-webp"]

[dependencies]
doc = { path = "../doc", features = ["serde"] }
geom = { path = "../geom" }
raster = { path = "../raster" }
engine = { path = "../engine" }
compose = { path = "../compose" }
webexport = { path = "../webexport" }
fwpng = { path = "../fwpng" }
io = { path = "../io" }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
gif = "0.14.2"
serde_json = { version = "1", features = ["float_roundtrip"] }
scripting = { path = "../scripting", optional = true }

[lints]
workspace = true
