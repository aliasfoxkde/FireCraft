[package]
name = "app"
version = "0.2.5-dryrun.2"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["FireCraft contributors"]
repository = "https://github.com/aliasfoxkde/FireCraft"
homepage = "https://github.com/aliasfoxkde/FireCraft"
description = "FireCraft editor shell: one canvas, one registry — every mutation goes through the engine. Clean-room implementation."

[[bin]]
name = "firecraft"
path = "src/main.rs"

[dependencies]
app-cli = { path = "../app-cli" }
color = { path = "../color" }
compose = { path = "../compose" }
doc = { path = "../doc" }
engine = { path = "../engine" }
fwpng = { path = "../fwpng" }
io = { path = "../io" }
flate2 = "1"
webexport = { path = "../webexport" }
geom = { path = "../geom" }
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
base64 = "0.22"
scripting = { path = "../scripting" }

[dev-dependencies]
# The test-side mirror of eframe's own persistence encoding (its
# `ron` dep is private), so the layout round-trip test exercises the
# exact on-disk shape.
ron = "0.12"

[lints]
workspace = true
