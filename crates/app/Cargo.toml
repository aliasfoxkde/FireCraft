[package]
name = "app"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["FireCraft contributors"]
repository = "https://github.com/aliasfoxkde/FireCraft"
homepage = "https://github.com/aliasfoxkde/FireCraft"
description = "FireCraft editor shell: one canvas, one registry — every mutation goes through the engine. Clean-room implementation."

[[bin]]
name = "firecraft"
path = "src/main.rs"

[dependencies]
app-cli = { path = "../app-cli" }
color = { path = "../color" }
compose = { path = "../compose" }
doc = { path = "../doc" }
engine = { path = "../engine" }
fwpng = { path = "../fwpng" }
geom = { path = "../geom" }
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
serde_json = "1"

[lints]
workspace = true
