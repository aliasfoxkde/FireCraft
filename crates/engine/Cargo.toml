[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "FireCraft editor engine: command registry, inverse deltas, transactional history, journal."

[dependencies]
base64 = "0.22"
doc = { path = "../doc", features = ["serde"] }
geom = { path = "../geom" }
raster = { path = "../raster", features = ["serde"] }
vector = { path = "../vector" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[features]
default = ["memory-fs"]
# In-memory file system for tests and offline demos (no std::fs, so
# it is itself wasm-clean).
memory-fs = []

[lints]
workspace = true
