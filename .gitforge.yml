# GitForge CI pipeline for FireCraft (self-hosted GitForge at
# /nas/Temp/repos/GitForge). Mirrors `cargo run -p xtask -- ci` — the
# same gates local dev runs — split into jobs so each gate's log
# survives the 64KiB head-only log cap and failures localize to one
# gate.
#
# Fleet constraints (learned on backend-fixed; see its .gitforge.yml for
# the run-by-run history):
# - `environment: {}` is REQUIRED: PipelineDefinition has no serde
#   default, and a missing key fails every run at parse time.
# - Jobs form a single chain: all jobs of one run share ONE per-run
#   workspace, and the offline validator rejects fork/join graphs.
# - Job- and step-level `env:` reach the container, but there is no
#   ref- or commit-shaped variable to rely on: the pipeline-level
#   `environment` must be present (`environment: {}` — the definition
#   has no serde default) and nothing useful is injected into it.
#   Anything a step needs is inline in `run`.
# - A step's `run:` block is ONE `sh -c` invocation, so its exit status
#   is the last command's status unless the block sets `set -e`. Every
#   multi-command block here sets it: without it a mid-block failure is
#   invisible whenever a later command happens to succeed. That masking
#   once hid a failing gate for dozens of runs (decision 0086).
# - `cache:` mounts a host-local Cargo target directory at `/cargo-target`
#   and exports `CARGO_TARGET_DIR`. This keeps rustc writes off the sshfs
#   workspace bridge while reusing compiled artifacts across runs.
#   The runner holds an EXCLUSIVE advisory lock on every writable host
#   directory a job mounts, for the job's whole lifetime (GitForge GF-11):
#   two jobs writing one target tree would clobber each other's binaries.
#   So the cache directory is PER JOB — `.../cargo/{image}-<job-name>` —
#   and not one directory per image. A single shared directory would
#   serialize every Cargo job in the fleet into one lane, which is the
#   throughput problem this cache is meant to fix. Each job keeps its own
#   warm tree; no two jobs contend for it. Two runs of the SAME job still
#   contend, by design: that is the case the lock exists for.
# - Job sandboxes run with CARGO_NET_OFFLINE=false: the image's
#   registry cache is a FAST FLOOR, not a wall. A crate already in the
#   cache touches the network not at all; a crate that is not costs one
#   small fetch (measured: index ~0.09 s, crate ~0.12 s) instead of a
#   dead pipeline. Rebuild + re-ship the image only when a pinned tool
#   version or the Rust minor moves — never merely because a lockfile
#   moved. The old offline wall turned every lockfile move into a
#   fleet-wide red, and the re-ship procedure that papered over it
#   broke whichever branch moved next; see decision 0073.
# - Images must be pre-warmed on every runner host before a commit that
#   needs them lands (60-second sandbox acquisition cap; the runner
#   never pulls). Ship with:
#     docker save firecraft-ci-rust:1 | ssh <host> docker load
# - Step logs are head-capped: cargo's compile spam comes first, so a
#   failure late in a long step can be truncated. Keep steps small.
# - A job's `timeout:` is a WATCHDOG, not a gate: it kills the
#   container and records `timed_out`, with no diagnostic about what
#   was slow. The budgets below are therefore sized from the fleet's
#   measured wall-clock, not from a round guess. The runner holds 4
#   concurrent containers on a 16-core host and each compiles the
#   workspace, so a co-tenant wave inflates a job roughly 4x:
#   fmt-layers measured 0.3 min idle and 20.1 min loaded; perf-budgets
#   3.2 min idle and 14.3 min loaded. Each budget below is ~2.5x the
#   worst *successful* duration observed on 2026-11-11 with 9 runs in
#   flight, so a loaded job still fits its budget and a genuinely hung
#   job is still killed. A budget that a passing job can outrun is
#   indistinguishable from a failure (issue #126).
#
# The image recipe is infrastructure/docker/ci-rust.Dockerfile; rebuild
# and re-ship it when a pinned tool version or the Rust minor moves. A
# lockfile move does NOT require a rebuild — the sandbox may fetch a
# crate its cache lacks (see the CARGO_NET_OFFLINE note above).
name: firecraft-ci
version: "1.0"
trigger_on:
  - push
  - tag
environment: {}
jobs:
  - name: fmt-layers
    image: firecraft-ci-rust:1
    cache:
      source: "{cache_root}/cargo/{image}-fmt-layers"
    steps:
      - name: Rust formatting check
        run: cargo fmt --all -- --check
      - name: Layer-table gate
        # Compiles xtask alone; the gate itself is cargo metadata.
        run: cargo run --locked -p xtask -- layers
    # 45m: the gate compiles xtask, so it carries the workspace's
    # build wave. Measured 20.1 min on 2026-11-11 with 9 runs in
    # flight (0.3 min idle); the previous 20m budget killed a run that
    # was 0.5 min from finishing.
    timeout: 45m

  - name: clippy-test
    image: firecraft-ci-rust:1
    cache:
      source: "{cache_root}/cargo/{image}-clippy-test"
    needs: [fmt-layers]
    steps:
      - name: Cargo clippy (deny warnings, all targets)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Web crate clippy (workspace-excluded, trunk)
        # The web crate is a separate workspace with its own lockfile, so it
        # keeps its own target tree — inside the job's cache mount, so the
        # artifacts survive the job.
        run: cd web && CARGO_TARGET_DIR=/cargo-target/web cargo clippy --all-targets --locked -- -D warnings
      - name: Workspace tests
        # Same container as the clippy step: the warm target dir carries
        # over, so the test build only completes what clippy checked.
        run: cargo test --workspace --locked --no-fail-fast -- --test-threads=2
    # The egui/eframe graph is the bulk of the workspace; the wall
    # absorbs co-tenant build waves on these shared hosts.
    # 150m: measured 76.9 min on 2026-11-11 with 9 runs in flight.
    timeout: 150m

  - name: wasm-web
    image: firecraft-ci-rust:1
    cache:
      source: "{cache_root}/cargo/{image}-wasm-web"
    needs: [clippy-test]
    steps:
      - name: Wasm compile gate + smoke suite + trunk bundle
        # The cache exports CARGO_TARGET_DIR to xtask's child cargo calls
        # and trunk's cargo build, keeping every rustc write off the
        # sshfs bridge. With wasm-bindgen-test-runner + node baked into
        # the image, the fwpng smoke suite executes for real (no
        # compile-only downgrade), and trunk builds the web bundle.
        run: cargo run --locked -p xtask -- wasm
    # 90m: measured 45.6 min on 2026-11-11 with 9 runs in flight.
    timeout: 90m

  - name: corpus-golden
    image: firecraft-ci-rust:1
    cache:
      source: "{cache_root}/cargo/{image}-corpus-golden"
    needs: [wasm-web]
    steps:
      - name: Corpus digests + doc-model round-trips
        run: cargo run --locked -p xtask -- corpus
      - name: Golden render pins + determinism
        run: cargo run --locked -p xtask -- golden
    # 45m: measured 19.6 min on 2026-11-11 with 9 runs in flight.
    timeout: 45m

  - name: perf-budgets
    image: firecraft-ci-rust:1
    cache:
      source: "{cache_root}/cargo/{image}-perf-budgets"
    needs: [corpus-golden]
    steps:
      - name: Performance budgets (open / frame / save / peak memory)
        # M12: the parity table's ceilings, enforced on the runner
        # fleet. The report line names the host, so a trip is
        # diagnosable as regression vs environment shift.
        run: cargo run --locked -p xtask -- perf
    # 45m: measured 14.3 min on 2026-11-11 with 9 runs in flight, but
    # two runs were killed at the previous 20m budget while still
    # working (one on 2026-11-11 at 20.2 min, one at 20.3 min). The
    # budget must exceed what a passing job can take.
    timeout: 45m

  - name: fuzz
    image: firecraft-ci-rust:1
    cache:
      source: "{cache_root}/cargo/{image}-fuzz"
    needs: [perf-budgets]
    steps:
      - name: Stable fuzz drivers (anchors + panic_hunt + scripting arms)
        # The stable-toolchain driver set from `xtask ci`; the
        # libfuzzer compile check and the wide campaign stay local
        # (nightly + cargo-fuzz are not baked into the CI image).
        #
        # The sandbox may fetch a crate its cache lacks, so a
        # fuzz/Cargo.lock move does NOT require an image rebuild (it
        # did in M9 task 8: the boa family — that rebuild is no longer
        # needed). A crate missing from the cache costs one small
        # fetch; the full error still reaches only the job log ledger,
        # not the bounded receipt.
        run: cargo run --locked -p xtask -- fuzz-quick
    # 30m proved too tight: a cold sandbox target dir spends ~20m
    # compiling before fuzz-quick starts (dfd7f46 run was killed by
    # the watchdog 10m into the campaign itself).
    # 120m: measured 52.9 min on 2026-11-11 with 9 runs in flight, so
    # the 60m budget left less than a quarter of an hour of margin.
    timeout: 120m

  - name: generated-docs
    image: firecraft-ci-rust:1
    cache:
      source: "{cache_root}/cargo/{image}-generated-docs"
    needs: [fuzz]
    steps:
      - name: Parity floors + scorecard + stamps + reachability + panel snapshot, then drift check
        # The committed generated docs must byte-equal what the gates
        # produce: copies are taken before regenerating, and cmp fails
        # the job on any hand-edit (git is not assumed in the checkout).
        # CHANGELOG.md runs without the cmp: it is generated FROM the
        # git log, so its own tip commit can never appear in the copy
        # it ships in — it is refreshed at release time (RELEASING.md).
        #
        # `set -e` is load-bearing. A step's `run:` block is one
        # `sh -c` invocation, so without it the block's exit status is
        # the LAST command's status: a failure in the middle was
        # invisible whenever a later `cmp` happened to succeed. That is
        # how `xtask changelog` could fail on every run (the CI image
        # ships no git) while the job stayed green — see decision 0086.
        # `xtask stamps` is the git-free half of that verb: the license
        # and version stamp checks, which the changelog verb used to run
        # after a step that had already died.
        #
        # `reachability` and `panel-snapshot` are the two gates that used
        # to exist only inside the local `xtask ci` list, so nothing in
        # CI enforced them. They are measured against committed
        # baselines (`.reachability-floor.tsv`, `crates/app/panels.snapshot`),
        # and both are rising-only or byte-exact: the pipeline is the
        # authoritative measurement oracle for the shell's coverage of
        # the command registry and for the CS6 panel inventory.
        run: |
          set -e
          cp docs/planning/generated/parity.md /tmp/parity.committed
          cp docs/planning/generated/scorecard.md /tmp/scorecard.committed
          cargo run --locked -p xtask -- parity
          cargo run --locked -p xtask -- scorecard
          cargo run --locked -p xtask -- stamps
          cargo run --locked -p xtask -- reachability
          cargo run --locked -p xtask -- panel-snapshot
          cmp /tmp/parity.committed docs/planning/generated/parity.md
          cmp /tmp/scorecard.committed docs/planning/generated/scorecard.md
    # 45m: measured 16.1 min on 2026-11-11 with 9 runs in flight.
    timeout: 45m

  - name: release
    image: firecraft-ci-rust:1
    cache:
      source: "{cache_root}/cargo/{image}-release"
    needs: [generated-docs]
    steps:
      - name: Ref report
        # GitForge stamps every push AND every tag push as TriggerType::
        # Push with the ref name carried verbatim; trigger_on cannot
        # distinguish them, and the runner executes every step of a job
        # regardless of what an earlier step decided. This step therefore
        # REPORTS the ref, it does not gate: the release-path build below
        # runs on every push, not only on a tag push.
        #
        # It used to claim the opposite — "on a branch push … the job
        # exits 0 without building (a normal push run stays cheap)" —
        # and that was false. Measured 2026-11-10 from the authoritative
        # store: run `9acd8b5a` was an ordinary branch push, and its
        # `release` job ran 52 minutes (19:37:29 → 20:29:56) with all
        # four step commands recorded. `exit 0` ends a step, not a job.
        #
        # Running the release path on every push is the intent: the web
        # bundle's bridge smoke and the native set's deb read-back are
        # the strongest evidence this pipeline can produce, and a
        # tag-only gate would withhold them from every pull request.
        #
        # It cannot ask git whether HEAD is a tag: the CI image ships no
        # git, so `git describe` failed and the old `if` took its "not a
        # tag push" branch on EVERY run — including real tag pushes. The
        # report says what it can prove instead of guessing. The ref is
        # known authoritatively on the run (GitForge records it as
        # `pipeline_runs.ref_name`) and on the host, where the release
        # workflow takes the tag as an argument. Adding git to the CI
        # image restores in-container tag detection; that is tracked as
        # debt in decision 0086.
        run: |
          set -e
          echo "release-path build — the CI image ships no git, so this step cannot detect the ref; the ref is on the pipeline run (pipeline_runs.ref_name) and in the release workflow's arguments"
      - name: "Web bundle (bridge smoke)"
        # Same container as the tag report; the release profile remains
        # distinct under the shared target cache's release subdirectory.
        # the bundle must come from tag bytes, not a warm debug cache.
        #
        # The bridge smoke RUNS here: `dist --web` serves the staged
        # bundle over loopback and drives one open -> apply -> exportPng
        # -> exportDocument round trip through the M5 postMessage bridge
        # in the image's headless chromium, requiring a `green` verdict
        # in the dumped DOM. The image bakes chromium (bookworm's
        # `chromium` package), so no skip switch is needed — and none is
        # accepted: a missing browser or a failed round trip must fail
        # the job, not pass it quietly.
        run: cargo run --locked -p xtask -- dist --web
      - name: Native set + deb read-back
        run: cargo run --locked -p xtask -- dist --native
      - name: DEB install verification (clean Debian 12)
        # The package must be installable, launchable and removable on
        # the platform it declares. `packaging/deb/verify-install.sh` is
        # that proof: install, desktop entry, icon, CLI, document round
        # trip, GUI launch, uninstall, reinstall. This image is Debian
        # 12, the platform the package declares (`libc6 >= 2.36`).
        #
        # `libxkbcommon-x11-0` is the X11 half of libxkbcommon: the
        # winit X11 backend dlopens `libxkbcommon-x11.so.0` through
        # `xkbcommon-dl`, and `libxkbcommon0` does not ship it. Without
        # it the GUI launch aborts with a panic instead of starting, and
        # the launch stage fails for a missing library rather than for
        # a broken package.
        #
        # The list is exactly the `Depends` of `packaging/deb/control`
        # (decision 0091) plus this stage's harness — `xvfb` and `xauth`
        # to give the launch a display, `desktop-file-utils` to
        # validate the desktop entry. Nothing else is installed, so a
        # green launch is evidence that the package's own declared
        # dependencies are sufficient.
        run: |
          set -e
          apt-get update -qq >/dev/null
          apt-get install -y -qq --no-install-recommends \
            xvfb xauth libgl1 libx11-6 libxcursor1 libxrandr2 libxi6 \
            libxkbcommon0 libxkbcommon-x11-0 desktop-file-utils >/dev/null
          bash packaging/deb/verify-install.sh \
            dist/native/firecraft_*_amd64.deb "" corpus/fixtures/composed.fw.png
      - name: Stage artifacts for the runner's artifact collection
        # The runner uploads everything under <workspace>/artifacts/ —
        # copy the dist outputs there so the run carries its bundles.
        run: |
          set -e
          mkdir -p artifacts
          cp -r dist/web artifacts/web
          cp -r dist/native artifacts/native
          # Manifests list bare filenames relative to their own
          # directory, so verify from inside each one.
          (cd artifacts/web && sha256sum -c MANIFEST.sha256)
          (cd artifacts/native && sha256sum -c MANIFEST.sha256)
    # 180m: measured 88.3 min on 2026-11-11 with 9 runs in flight —
    # 1.7 minutes inside the previous 90m budget. The release job is
    # the longest in the chain and runs last, when the fleet is most
    # loaded, so it is the job most likely to be killed by its budget.
    timeout: 180m
