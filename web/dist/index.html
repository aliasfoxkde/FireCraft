<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="description" content="FireCraft — a clean-room Fireworks-class vector and bitmap editor, running in the browser via WebAssembly."/>
    <title>FireCraft</title>
    <link rel="icon" href="favicon.png" type="image/png">
    
    
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #202020;
        }

        /* eframe owns sizing; the canvas fills the viewport. The focus
           ring stays (WCAG 2.4.7): the canvas is tabbable and egui
           routes keyboard input through it. */
        #firecraft-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #firecraft-canvas:focus-visible {
            outline: 2px solid #7ab8ff;
            outline-offset: -2px;
        }
    </style>
<link rel="modulepreload" href="/firecraft-web-b54b722470176d6d.js" crossorigin="anonymous" integrity="sha384-3KC548hguhMPjgckJejo0uE3YR7MHqVTmEHp5A4C5uC+vf0Yas4EUpyMqWLJgwgt"><link rel="preload" href="/firecraft-web-b54b722470176d6d_bg.wasm" crossorigin="anonymous" integrity="sha384-FDRQdn3gj3iVJzz+BtkRxuChhjMowG1X86Y1q7w1xsw0Pm1KD1B+iDAMVJQiPaNc" as="fetch" type="application/wasm"></head>
<body>
<!-- Accessible fallback: replaced once the egui runtime takes the
     canvas over; readable by screen readers while the wasm loads and
     if it never does. -->
<canvas id="firecraft-canvas" aria-label="FireCraft editor canvas" aria-describedby="firecraft-fallback">
    <span id="firecraft-fallback">
        FireCraft is a vector and bitmap editor. It needs WebAssembly
        and WebGL; your browser did not start it. See
        https://github.com/aliasfoxkde/FireCraft for the desktop build.
    </span>
</canvas>

<script type="module">
import init, * as bindings from '/firecraft-web-b54b722470176d6d.js';
const wasm = await init({ module_or_path: '/firecraft-web-b54b722470176d6d_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script></body>
</html>
