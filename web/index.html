<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>FireCraft</title>
    <link data-trunk rel="rust" data-bin="firecraft-web" data-wasm-opt="2"/>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #202020;
        }

        /* eframe owns sizing; the canvas fills the viewport. */
        #firecraft-canvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
        }
    </style>
</head>
<body>
<canvas id="firecraft-canvas"></canvas>
</body>
</html>
