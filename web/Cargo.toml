[package]
name = "firecraft-web"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["FireCraft contributors"]
repository = "https://github.com/aliasfoxkde/FireCraft"
homepage = "https://github.com/aliasfoxkde/FireCraft"
description = "FireCraft editor shell for the browser: the app shell under trunk, plus a postMessage bridge for WebOS embedding. Clean-room implementation."

[[bin]]
name = "firecraft-web"
path = "src/main.rs"

[dependencies]
app = { path = "../crates/app" }
app-cli = { path = "../crates/app-cli" }
compose = { path = "../crates/compose" }
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
engine = { path = "../crates/engine" }
fwpng = { path = "../crates/fwpng" }
io = { path = "../crates/io" }
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "console",
    "Document",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "MessageEvent",
    "Url",
    "Window",
] }

[lints]
workspace = true
