<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E87A2E"/>
      <stop offset="1" stop-color="#2F6FD8"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB65C"/>
      <stop offset="1" stop-color="#F4F1EA"/>
    </linearGradient>
  </defs>
  <!-- rounded-square badge -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#brand)"/>
  <!-- flame body: a closed vector path, as if mid-edit -->
  <path d="M64 26
           C 78 38, 86 50, 84 66
           C 83 76, 76 82, 76 90
           C 76 98, 70 104, 64 104
           C 58 104, 52 98, 52 90
           C 52 82, 45 76, 44 66
           C 42 50, 50 38, 64 26 Z"
        fill="url(#flame)"
        stroke="#2B313D" stroke-width="2"/>
  <!-- inner flame cut -->
  <path d="M64 62
           C 70 70, 72 76, 70 84
           C 69 90, 66 94, 64 94
           C 62 94, 59 90, 58 84
           C 56 76, 58 70, 64 62 Z"
        fill="#E87A2E"/>
  <!-- vector-edit overlay: anchor points -->
  <g stroke="#2B313D" stroke-width="1.5">
    <rect x="61" y="23" width="6" height="6" fill="#2F6FD8"/>
    <circle cx="84" cy="66" r="3.5" fill="#FFFFFF"/>
    <circle cx="76" cy="90" r="3.5" fill="#FFFFFF"/>
    <circle cx="64" cy="104" r="3.5" fill="#FFFFFF"/>
    <circle cx="52" cy="90" r="3.5" fill="#FFFFFF"/>
    <circle cx="44" cy="66" r="3.5" fill="#FFFFFF"/>
  </g>
  <!-- Bézier direction handles on the apex anchor -->
  <g stroke="#2B313D" stroke-width="1.5">
    <line x1="64" y1="26" x2="50" y2="20"/>
    <line x1="64" y1="26" x2="78" y2="20"/>
  </g>
  <g fill="#2B313D">
    <circle cx="50" cy="20" r="2.5"/>
    <circle cx="78" cy="20" r="2.5"/>
  </g>
  <!-- selection bounding box, thin dashes -->
  <rect x="36" y="16" width="56" height="96" rx="4"
        fill="none" stroke="#2F6FD8" stroke-width="1.5"
        stroke-dasharray="4 3" opacity="0.9"/>
</svg>
