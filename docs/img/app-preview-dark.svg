<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-labelledby="title desc">
  <title id="title">FireCraft in dark mode, editing a vector fox</title>
  <desc id="desc">A mock-up of the FireCraft workspace in dark mode: a geometric fox illustration sits on the artboard with live path nodes on its outline, a layers panel lists the fox's parts, and a timeline runs along the bottom.</desc>
  <defs>
    <linearGradient id="fox" x1="424" y1="223" x2="696" y2="477" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2843F"/>
      <stop offset="1" stop-color="#D2511F"/>
    </linearGradient>
    <linearGradient id="glow" x1="560" y1="230" x2="560" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8b24" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ff8b24" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- chrome -->
  <rect width="1280" height="760" fill="#1b1e25"/>
  <rect x="0" y="0" width="1280" height="34" fill="#232630"/>
  <rect x="0" y="33" width="1280" height="1" fill="#333845"/>
  <g font-family="DejaVu Sans, sans-serif" font-size="11" fill="#b7bac3">
    <text x="18" y="21">File</text>
    <text x="52" y="21">Edit</text>
    <text x="90" y="21">Modify</text>
    <text x="140" y="21">Text</text>
    <text x="180" y="21">Select</text>
    <text x="228" y="21">Command</text>
    <text x="290" y="21">View</text>
    <text x="330" y="21">Window</text>
    <text x="382" y="21">Help</text>
    <text x="1050" y="21" fill="#7d828d">untitled.fw.png — 100%</text>
  </g>
  <g fill="#3a3f4c">
    <circle cx="1236" cy="17" r="4"/>
    <circle cx="1252" cy="17" r="4"/>
    <circle cx="1268" cy="17" r="4"/>
  </g>

  <!-- tool strip -->
  <rect x="0" y="34" width="56" height="684" fill="#21242d"/>
  <rect x="55" y="34" width="1" height="684" fill="#333845"/>
  <g fill="none" stroke="#8d93a0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 56l12 20-8-1-4 7z"/>
    <path d="M22 96l12 20-8-1-4 7z" opacity=".55"/>
    <path d="M18 140h18M18 148h18M18 156h18"/>
    <circle cx="27" cy="196" r="8"/>
    <path d="M27 196l6-5"/>
    <path d="M20 240h14v14H20z"/>
    <path d="M22 286h10M22 292h10" opacity=".55"/>
  </g>
  <text x="27" y="336" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#8d93a0" text-anchor="middle">T</text>
  <g fill="none" stroke="#8d93a0" stroke-width="1.6" opacity=".55">
    <path d="M20 380h14M20 388h14M20 396h9"/>
    <circle cx="27" cy="440" r="7"/>
  </g>

  <!-- canvas -->
  <rect x="56" y="34" width="944" height="606" fill="#2a2e37"/>
  <rect x="300" y="90" width="520" height="520" fill="#20242e"/>
  <rect x="299.5" y="89.5" width="521" height="521" fill="none" stroke="#3c414d"/>
  <ellipse cx="560" cy="380" rx="200" ry="150" fill="url(#glow)"/>

  <!-- the fox -->
  <g transform="translate(300 105)">
    <path d="M150 118L214 182L260 172L306 182L370 118L396 220L366 306L300 356L260 372L220 356L154 306L124 220Z" fill="url(#fox)"/>
    <path d="M150 118L214 182L186 200L156 196Z" fill="#3c2a24"/>
    <path d="M370 118L306 182L334 200L364 196Z" fill="#3c2a24"/>
    <path d="M124 220L154 306L220 356L196 262Z" fill="#c9451b" opacity=".85"/>
    <path d="M396 220L366 306L300 356L324 262Z" fill="#c9451b" opacity=".85"/>
    <path d="M260 172L242 244L260 254L278 244Z" fill="#f7e9d4" opacity=".9"/>
    <path d="M260 236C226 240 206 264 214 292C224 322 244 336 260 336C276 336 296 322 306 292C314 264 294 240 260 236Z" fill="#f7e9d4"/>
    <path d="M244 250L276 250L260 276Z" fill="#241a17"/>
    <path d="M260 276L252 292L268 292Z" fill="#241a17" opacity=".55"/>
    <path d="M176 224L214 214L228 244L184 248Z" fill="#241a17"/>
    <path d="M344 224L306 214L292 244L336 248Z" fill="#241a17"/>
    <path d="M182 228L210 220L216 234L186 238Z" fill="#f7e9d4" opacity=".25"/>
    <path d="M338 228L310 220L304 234L334 238Z" fill="#f7e9d4" opacity=".25"/>
  </g>

  <!-- live path selection -->
  <g fill="none" stroke="#6ea8fe" stroke-width="1.4">
    <rect x="414" y="213" width="292" height="274" stroke-dasharray="5 4"/>
  </g>
  <g fill="#0f1218" stroke="#6ea8fe" stroke-width="1.4">
    <rect x="410" y="209" width="8" height="8"/>
    <rect x="556" y="209" width="8" height="8"/>
    <rect x="702" y="209" width="8" height="8"/>
    <rect x="410" y="346" width="8" height="8"/>
    <rect x="702" y="346" width="8" height="8"/>
    <rect x="410" y="483" width="8" height="8"/>
    <rect x="556" y="483" width="8" height="8"/>
    <rect x="702" y="483" width="8" height="8"/>
  </g>
  <g fill="#6ea8fe">
    <rect x="428" y="225" width="7" height="7"/>
    <rect x="518" y="271" width="7" height="7"/>
    <rect x="582" y="283" width="7" height="7"/>
    <rect x="650" y="223" width="7" height="7"/>
    <rect x="424" y="392" width="7" height="7"/>
    <rect x="690" y="392" width="7" height="7"/>
  </g>
  <g stroke="#6ea8fe" stroke-width="1.2" opacity=".8">
    <path d="M431 228L446 240"/>
    <path d="M521 274L534 262"/>
    <path d="M585 286L598 300"/>
    <path d="M653 226L640 240"/>
  </g>

  <!-- right panels -->
  <rect x="1000" y="34" width="280" height="684" fill="#21242d"/>
  <rect x="999" y="34" width="1" height="684" fill="#333845"/>
  <rect x="1000" y="34" width="280" height="26" fill="#262a34"/>
  <text x="1014" y="51" font-family="DejaVu Sans, sans-serif" font-size="9.5" letter-spacing="1.6" fill="#8d93a0">LAYERS</text>
  <g font-family="DejaVu Sans, sans-serif" font-size="11.5">
    <rect x="1000" y="60" width="280" height="26" fill="#2f3542"/>
    <rect x="1000" y="60" width="2" height="26" fill="#f0a94c"/>
    <g fill="#8d93a0">
      <circle cx="1016" cy="73" r="3.5"/>
      <circle cx="1016" cy="99" r="3.5"/>
      <circle cx="1016" cy="125" r="3.5"/>
      <circle cx="1016" cy="151" r="3.5"/>
      <circle cx="1016" cy="177" r="3.5"/>
    </g>
    <text x="1032" y="77" fill="#f0f0f2">fox-head</text>
    <text x="1032" y="103" fill="#a9adb8">muzzle</text>
    <text x="1032" y="129" fill="#a9adb8">eyes</text>
    <text x="1032" y="155" fill="#a9adb8">ear-inner</text>
    <text x="1032" y="181" fill="#a9adb8">background</text>
  </g>
  <rect x="1000" y="210" width="280" height="1" fill="#333845"/>
  <rect x="1000" y="210" width="280" height="26" fill="#262a34"/>
  <text x="1014" y="227" font-family="DejaVu Sans, sans-serif" font-size="9.5" letter-spacing="1.6" fill="#8d93a0">PROPERTIES</text>
  <g font-family="DejaVu Sans, sans-serif" font-size="11" fill="#a9adb8">
    <text x="1014" y="256">X</text>
    <text x="1050" y="256" fill="#d9dbe1">260</text>
    <text x="1114" y="256">Y</text>
    <text x="1146" y="256" fill="#d9dbe1">236</text>
    <text x="1014" y="284">W</text>
    <text x="1050" y="284" fill="#d9dbe1">268</text>
    <text x="1114" y="284">H</text>
    <text x="1146" y="284" fill="#d9dbe1">254</text>
    <text x="1014" y="320">Fill</text>
    <text x="1014" y="348">Stroke</text>
    <text x="1014" y="376">Blend</text>
    <text x="1014" y="404">Opacity</text>
  </g>
  <rect x="1050" y="310" width="14" height="14" fill="#e8622a"/>
  <text x="1074" y="322" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#d9dbe1">#E8622A</text>
  <text x="1050" y="322" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#6f7481">—</text>
  <text x="1050" y="350" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#d9dbe1">none</text>
  <text x="1050" y="378" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#d9dbe1">Normal</text>
  <text x="1050" y="406" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#d9dbe1">100%</text>

  <!-- timeline -->
  <rect x="56" y="640" width="944" height="78" fill="#21242d"/>
  <rect x="56" y="640" width="944" height="1" fill="#333845"/>
  <text x="74" y="662" font-family="DejaVu Sans, sans-serif" font-size="9.5" letter-spacing="1.6" fill="#8d93a0">TIMELINE</text>
  <g stroke="#3a3f4c" stroke-width="1">
    <path d="M74 690h880"/>
    <path d="M74 676v28"/>
    <path d="M194 682v16"/>
    <path d="M314 682v16"/>
    <path d="M434 682v16"/>
    <path d="M554 682v16"/>
    <path d="M674 682v16"/>
    <path d="M794 682v16"/>
    <path d="M914 676v28"/>
  </g>
  <rect x="74" y="678" width="120" height="22" fill="#2f3542" stroke="#f0a94c" stroke-width="1.2"/>
  <g font-family="DejaVu Sans, sans-serif" font-size="9.5" fill="#7d828d">
    <text x="74" y="712">0:00</text>
    <text x="884" y="712">0:10</text>
  </g>

  <!-- status bar -->
  <rect x="0" y="718" width="1280" height="42" fill="#232630"/>
  <rect x="0" y="718" width="1280" height="1" fill="#333845"/>
  <g font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#7d828d">
    <text x="18" y="744">100%</text>
    <text x="70" y="744">Snap: 8px grid</text>
    <text x="176" y="744">RGB / 8</text>
    <text x="252" y="744">5 layers</text>
    <text x="330" y="744">fox-head · path</text>
    <text x="1140" y="744">DARK MODE</text>
  </g>
</svg>
